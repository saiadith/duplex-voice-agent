[project]
name = "voice-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
silero = ["silero-vad>=5", "torch"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["."]
